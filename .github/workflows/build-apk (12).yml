name: Build King VPN APK

# ساخت خودکار فایل APK اندروید روی سرورهای گیت‌هاب — بدون نیاز به کامپیوتر.
# کافی است سورس‌کد (فایل زیپ) در ریپازیتوری آپلود شود؛ ساخت خودش شروع می‌شود.
#
# نکته‌ی مهم: خطای واقعی Gradle هرگز بلعیده نمی‌شود. اگر build شکست بخورد،
# همان خروجی واقعی gradlew در لاگ Actions دیده می‌شود و job با خطا متوقف می‌شود.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and find the app folder
        run: |
          set -e
          if [ -f package.json ]; then
            echo "APP_DIR=$PWD" >> "$GITHUB_ENV"
            echo "App source is at the repository root."
            exit 0
          fi
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP ..."
            rm -rf _src && mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            DIR=$(find _src -maxdepth 3 -name package.json -printf '%h\n' | head -n 1)
          else
            DIR=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)
          fi
          if [ -z "$DIR" ]; then
            echo "::error::No package.json found. Upload king-vpn-source.zip to the repository."
            exit 1
          fi
          echo "APP_DIR=$PWD/$DIR" >> "$GITHUB_ENV"
          echo "App source found at $DIR"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The tunnel module ships prebuilt .so files, so AGP runs its native-symbol
      # stripping task and needs an NDK. The runner image does not ship the version
      # React Native 0.86 / Expo SDK 57 pins (27.1.12297006), and when AGP cannot find
      # it the failure surfaces as an unreadable "DeferredUtil.unpack" stack trace.
      # Installing the exact pinned version up front removes that whole class of error.
      - name: Install the pinned Android NDK
        run: |
          set -e
          NDK_VERSION="27.1.12297006"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already present."
          else
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
            echo "Installed NDK $NDK_VERSION."
          fi
          ls -1 "$SDK_ROOT/ndk"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # دو کتابخانه‌ی نیتیو تونل روی هم حدود ۶۰ مگابایت هستند و از سقف ۲۵ مگابایتی
      # آپلود مرورگر گیت‌هاب بزرگ‌ترند، پس داخل زیپ نیستند و اینجا از صفحه‌ی رسمی
      # انتشارشان دانلود می‌شوند — با نسخه‌ی پین‌شده و چک‌سام SHA-256 تا build هرگز
      # بی‌صدا باینری دیگری برندارد.
      - name: Fetch the native tunnel libraries
        run: |
          set -e
          LIBS="$APP_DIR/modules/king-vpn-tunnel/android/libs"
          mkdir -p "$LIBS"

          echo "Downloading Xray core (libv2ray.aar v26.11.9) ..."
          curl -sSL --fail --retry 3 -o "$LIBS/libv2ray.aar" \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar"

          echo "Downloading TUN-to-SOCKS5 bridge (hev-socks5-tunnel 2.20.0) ..."
          curl -sSL --fail --retry 3 -o "$LIBS/hev.aar" \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar"

          echo "Verifying checksums ..."
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  $LIBS/libv2ray.aar" | sha256sum -c -
          echo "ae8a2e96b80b4eccccd037805a4bb4a278090c89dbcae8bc6fcb7634e9a255b9  $LIBS/hev.aar" | sha256sum -c -

          ls -lh "$LIBS"

      - name: Generate the Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --no-install --clean

      # حافظه‌ی Gradle از اینجا تنظیم می‌شود (نه با GRADLE_OPTS در env)، چون
      # gradle.properties تنها جایی است که همیشه و برای همه‌ی daemonها اعمال می‌شود.
      - name: Configure Gradle memory
        run: |
          set -e
          PROPS="$APP_DIR/android/gradle.properties"
          if [ ! -f "$PROPS" ]; then
            echo "::error::android/gradle.properties was not generated by prebuild."
            exit 1
          fi
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|' "$PROPS"
          else
            printf '\norg.gradle.jvmargs=-Xmx4g\n' >> "$PROPS"
          fi
          echo "--- gradle.properties (jvmargs) ---"
          grep -n 'org.gradle.jvmargs' "$PROPS"

      # فقط assembleRelease اجرا می‌شود. هیچ fallback و هیچ || وجود ندارد، تا اگر
      # Gradle شکست خورد، خطای واقعی در لاگ دیده شود و job با exit code درست بایستد.
      - name: Build the APK
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p output
          APK=$(find "$APP_DIR/android/app/build/outputs/apk" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          cp "$APK" output/king-vpn.apk
          ls -lh output

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-apk
          path: output/king-vpn.apk
          if-no-files-found: error

      - name: Publish a download link (Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" output/king-vpn.apk \
            --title "KING VPN APK (build ${{ github.run_number }})" \
            --notes "APK ساخته‌شده به‌صورت خودکار از سورس‌کد. برای نصب، فایل king-vpn.apk را دانلود کنید." \
            --latest \
          || gh release upload "$TAG" output/king-vpn.apk --clobber
